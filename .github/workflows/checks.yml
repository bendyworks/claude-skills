name: checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner /repo

  identifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for personal/client identifiers
        run: bash scripts/check-identifiers.sh

  ruby-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # The simplecov pin must match the install hint in
      # test/coverage_helper.rb and the tripwire assertion in
      # test/coverage_helper_test.rb; update all three together. The
      # json formatter is pinned here too (installed first, so
      # simplecov's loose ~> 0.1 constraint is already satisfied):
      # the integrity guard below depends on coverage.json's schema.
      - name: Install SimpleCov
        run: |
          gem install simplecov_json_formatter -v 0.1.4
          gem install simplecov -v 0.22.0
      - name: Run bin helper tests with coverage
        env:
          COVERAGE: '1'
        run: |
          for test_file in test/*_test.rb; do
            ruby "$test_file" || exit 1
          done
      # Guards artifact integrity, not a coverage percentage: every
      # regression that breaks measurement (helper require drift, root
      # or glob resolution, command_name collisions) fails silently
      # with a green suite and an empty artifact. The script is
      # single-quoted for the shell, so keep apostrophes out of its
      # body; move it to a scripts/ file if it grows.
      - name: Assert coverage artifact integrity
        run: |
          ruby -rjson -e '
            files = JSON.parse(File.read("coverage/coverage.json")).fetch("coverage")
            clis = Dir.children("bin").sort
            abort "no CLIs found under bin/" if clis.empty?
            clis.each do |cli|
              path = files.keys.find { |key| key.end_with?("/bin/#{cli}") }
              abort "coverage.json is missing bin/#{cli}" unless path
              covered = files.fetch(path).fetch("lines").count { |hits| hits.to_i.positive? }
              abort "coverage.json has no covered lines for bin/#{cli}" unless covered.positive?
            end
          '
      # Success-only upload on purpose: the test loop exits at the
      # first red file, so a partial artifact would mislead.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .
